<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Game Hub</title>
<style>
  /* 게임은 손대지 않고 iframe 으로 띄운다. 그래서 게임 화면 위에 허브 버튼이
     겹치지 않도록, 위에 얇은 띠를 두고 그 아래를 통째로 게임에 준다. */
  :root {
    --bar: 38px;
    --line: rgba(140,170,230,.16);
    --text: #e9eefc;
    --text-dim: #9aa8c7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #080b13; }
  body {
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "맑은 고딕", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  #bar {
    height: var(--bar); flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px; padding: 0 10px;
    background: linear-gradient(180deg, #121a2b, #0c1220);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 2px 10px rgba(0,0,0,.4);
  }
  #bar a, #bar button {
    display: inline-flex; align-items: center; gap: 5px;
    height: 26px; padding: 0 11px; border-radius: 8px;
    border: 1px solid var(--line); background: rgba(255,255,255,.05);
    color: var(--text-dim); font-size: 12px; font-weight: 700; font-family: inherit;
    text-decoration: none; cursor: pointer; white-space: nowrap;
    transition: background .14s, color .14s, border-color .14s;
  }
  #bar a:hover, #bar button:hover { background: rgba(255,255,255,.1); color: var(--text); border-color: rgba(140,170,230,.4); }
  #title { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; letter-spacing: .02em;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
  #frame { flex: 1 1 auto; min-height: 0; width: 100%; border: 0; display: block; background: #080b13; }
  #miss { margin: auto; text-align: center; padding: 24px; line-height: 1.8; color: var(--text-dim); font-size: 14px; }
  #miss a { color: #7fb2ff; }
  @media (max-width: 480px) { #bar button.wide { display: none; } }
</style>
</head>
<body>
<div id="bar">
  <a href="index.html" id="back">← 허브</a>
  <span id="title">게임</span>
  <button id="btnFull" class="wide" type="button">전체화면</button>
  <button id="btnNew" type="button">새 탭</button>
</div>
<iframe id="frame" title="게임" allow="autoplay; fullscreen"></iframe>

<script>
"use strict";

/* 허브에 담긴 게임 — index.html 의 목록과 id 가 같아야 한다 */
const GAMES = {
  slime: { name: '슬라임 키우기',          file: 'games/slime.html' },
  nexus: { name: '넥서스 디펜스',          file: 'games/nexus.html' },
  money: { name: '머니 디펜스',            file: 'games/money.html' },
  wall:  { name: '극한 벽짓고 살아남기',   file: 'games/wall.html' },
};

const $ = id => document.getElementById(id);
const id = new URLSearchParams(location.search).get('game');
const g = GAMES[id];

if (!g) {
  // 주소를 잘못 열었을 때 — 허브로 돌아갈 길을 준다
  $('frame').remove();
  $('title').textContent = '게임을 찾을 수 없습니다';
  document.body.insertAdjacentHTML('beforeend',
    '<p id="miss">그런 게임이 없습니다.<br><a href="index.html">허브로 돌아가기</a></p>');
} else {
  document.title = g.name + ' — Game Hub';
  $('title').textContent = g.name;
  const frame = $('frame');
  frame.src = g.file;
  // 키보드(Space·단축키)가 바로 게임으로 가도록 띄우자마자 iframe 에 초점을 준다
  frame.addEventListener('load', () => { try { frame.contentWindow.focus(); } catch (e) {} });
  $('btnNew').onclick = () => window.open(g.file, '_blank', 'noopener');
  $('btnFull').onclick = () => {
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen();
  };
}
</script>
</body>
</html>
